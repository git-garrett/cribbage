<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Sign in</title>
  <style nonce="{{ g.style_nonce }}">
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #23262b; background: #f5f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 28px 20px; }
    main { width: 100%; max-width: 360px; padding: 32px; background: #fff; border: 1px solid #dfe2e7; border-radius: 12px; }
    h1 { font-size: 24px; font-weight: 600; letter-spacing: -.5px; margin: 0 0 28px; }
    label { display: block; font-size: 14px; margin: 18px 0 7px; }
    input, button { width: 100%; font: inherit; font-size: 16px; border-radius: 6px; min-height: 46px; }
    input { background: #fff; color: #23262b; border: 1px solid #aeb5bf; padding: 10px 12px; }
    button { margin-top: 26px; padding: 11px 16px; color: #fff; background: #303a49; border: 0; cursor: pointer; font-weight: 600; }
    button:hover { background: #202a39; }
    :focus-visible { outline: 3px solid #687b98; outline-offset: 3px; }
    .error { color: #92332e; background: #fff4f3; font-size: 14px; line-height: 1.5; padding: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form action="/login" method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="128" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
