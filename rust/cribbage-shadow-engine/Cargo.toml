[package]
name = "cribbage-shadow-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "cribbage_shadow_engine"
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
xz2 = { version = "0.1.7", features = ["static"] }

[[bin]]
name = "cribbage-shadow-engine"
path = "main.rs"

[[bin]]
name = "cribbage-decision-worker"
path = "bin/decision-worker.rs"

[[bin]]
name = "pgo-workload"
path = "bin/pgo-workload.rs"

[[bin]]
name = "build-model283-opening"
path = "bin/build-model283-opening.rs"

[[bin]]
name = "model283-hands"
path = "bin/model283-hands.rs"
