[package]
name = "cribbage-api"
version = "16.3.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
base64 = "0.22"
cribbage-shadow-engine = { path = "../cribbage-shadow-engine" }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[[bin]]
name = "cribbage-api"
path = "main.rs"
