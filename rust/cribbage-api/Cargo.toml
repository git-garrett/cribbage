[package]
name = "cribbage-api"
version = "16.0.0"
edition = "2021"

[dependencies]
cribbage-shadow-engine = { path = "../cribbage-shadow-engine" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "cribbage-api"
path = "main.rs"
