name: Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pip install -e '.[dev]'
      - run: scripts/run-quiet.sh "Python lint" flake8 src tests scripts webapp.py --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: scripts/run-quiet.sh "Python tests" pytest
      - run: npm run --silent test:quiet-wrapper
      - run: npm run --silent typecheck
      - run: npm run --silent test:web
      - run: npm test --silent
      - run: npm run --silent build
      - run: scripts/run-quiet.sh "Browser regressions" node scripts/test-browser-regressions.cjs
