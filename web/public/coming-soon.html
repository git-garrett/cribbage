<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strong Cribbage - Coming Soon</title>
    <meta name="description" content="Strong Cribbage is building a sharper cribbage training engine. The public site is coming soon.">
    <meta property="og:title" content="Strong Cribbage">
    <meta property="og:description" content="A sharper cribbage training engine is coming soon.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://strongcribbage.com/">
    <meta property="og:image" content="https://strongcribbage.com/social-preview-counted-monogram.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Strong Cribbage — Play. Learn. Master the game.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Strong Cribbage">
    <meta name="twitter:description" content="A sharper cribbage training engine is coming soon.">
    <meta name="twitter:image" content="https://strongcribbage.com/social-preview-counted-monogram.png">
    <meta name="twitter:image:alt" content="Strong Cribbage — Play. Learn. Master the game.">
    <link rel="icon" type="image/svg+xml" href="/brand/strong-cribbage-mark-micro.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
      :root {
        color-scheme: dark;
        --green: #0b5b43;
        --green-light: #258460;
        --green-dark: #074535;
        --navy: #071f38;
        --cream: #fbf8f0;
        --muted: #cfe8de;
        --gold: #e8c575;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 18px;
        background: radial-gradient(circle at 50% 18%, var(--green-light) 0, var(--green) 42%, var(--green-dark) 100%);
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 780px);
        display: grid;
        justify-items: center;
        gap: 20px;
        padding: clamp(28px, 7vw, 58px);
        border: 1px solid rgba(232, 197, 117, 0.72);
        border-radius: 28px;
        background: rgba(7, 31, 56, 0.94);
        box-shadow: 0 26px 58px rgba(2, 28, 21, 0.38);
        text-align: center;
      }

      img {
        width: min(100%, 510px);
        height: auto;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .eyebrow {
        margin: 0;
        color: var(--gold);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      p {
        max-width: 560px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(18px, 4vw, 24px);
        line-height: 1.35;
      }

      a {
        min-width: min(100%, 310px);
        min-height: 56px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border: 2px solid var(--gold);
        border-radius: 999px;
        background: var(--green);
        color: var(--cream);
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/strong-cribbage-lockup-dark.svg" alt="">
      <h1 class="visually-hidden">Strong Cribbage</h1>
      <p class="eyebrow">Coming soon</p>
      <p>Strong cribbage is going to be the strongest cribbage playing app in the App Store. Version 13.0 is already very good. It’s going to get better. Soon we’ll add training and teaching features. For now you can play the preview.</p>
      <a href="https://cribbage.strongcribbage.com/">Play the preview</a>
    </main>
  </body>
</html>
