<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strong Cribbage - Coming Soon</title>
    <meta name="description" content="Strong Cribbage is building a sharper cribbage training engine. The public site is coming soon.">
    <meta name="theme-color" content="#e8eee9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#063d30" media="(prefers-color-scheme: dark)">
    <meta property="og:title" content="Strong Cribbage">
    <meta property="og:description" content="A sharper cribbage training engine is coming soon.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://strongcribbage.com/">
    <meta property="og:image" content="https://strongcribbage.com/social-preview-counted-monogram.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Strong Cribbage — Play. Learn. Master the game.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Strong Cribbage">
    <meta name="twitter:description" content="A sharper cribbage training engine is coming soon.">
    <meta name="twitter:image" content="https://strongcribbage.com/social-preview-counted-monogram.png">
    <meta name="twitter:image:alt" content="Strong Cribbage — Play. Learn. Master the game.">
    <link rel="icon" type="image/svg+xml" href="/brand/strong-cribbage-mark-micro.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
      :root {
        color-scheme: light;
        --green: #0b5b43;
        --navy: #071f38;
        --cream: #fbf8f0;
        --canvas: #e8eee9;
        --canvas-glow: rgba(24, 123, 91, 0.2);
        --grid: rgba(7, 31, 56, 0.055);
        --panel: #fbf8f0;
        --text: #071f38;
        --muted: #52615b;
        --gold: #8f6720;
        --border: #c5a85d;
        --shadow: 0 26px 58px rgba(20, 35, 30, 0.16);
        --button-text: #fbf8f0;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --canvas: #042d22;
          --canvas-glow: rgba(37, 132, 96, 0.42);
          --grid: rgba(232, 197, 117, 0.055);
          --panel: #071f38;
          --text: #fbf8f0;
          --muted: #cfe8de;
          --gold: #e8c575;
          --border: rgba(232, 197, 117, 0.72);
          --shadow: 0 26px 58px rgba(2, 28, 21, 0.38);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 18px;
        background:
          radial-gradient(circle at 50% 18%, var(--canvas-glow), transparent 34rem),
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px),
          var(--canvas);
        background-size: auto, 42px 42px, 42px 42px, auto;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 780px);
        display: grid;
        justify-items: center;
        gap: 20px;
        padding: clamp(28px, 7vw, 58px);
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: var(--shadow);
        text-align: center;
      }

      .homepage-logo {
        display: block;
        width: min(100%, 510px);
      }

      .homepage-logo img {
        display: block;
        width: 100%;
        height: auto;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .eyebrow {
        margin: 0;
        color: var(--gold);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      p {
        max-width: 560px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(18px, 4vw, 24px);
        line-height: 1.35;
      }

      a {
        min-width: min(100%, 310px);
        min-height: 56px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border: 2px solid var(--gold);
        border-radius: 999px;
        background: var(--green);
        color: var(--button-text);
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <picture class="homepage-logo">
        <source media="(prefers-color-scheme: dark)" srcset="/brand/strong-cribbage-lockup-dark.svg">
        <img src="/brand/strong-cribbage-lockup-light.svg" alt="">
      </picture>
      <h1 class="visually-hidden">Strong Cribbage</h1>
      <p class="eyebrow">Coming soon</p>
      <p>Strong cribbage is going to be the strongest cribbage playing app in the App Store. Version 13.0 is already very good. It’s going to get better. Soon we’ll add training and teaching features. For now you can play the preview.</p>
      <a href="https://cribbage.strongcribbage.com/">Play the preview</a>
    </main>
  </body>
</html>
