<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Strong Cribbage - Coming Soon</title>
    <meta name="description" content="Strong Cribbage is building a sharper cribbage training engine. The public site is coming soon.">
    <meta property="og:title" content="Strong Cribbage">
    <meta property="og:description" content="A sharper cribbage training engine is coming soon.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://strongcribbage.com/">
    <meta property="og:image" content="https://strongcribbage.com/social-preview.png">
    <meta property="og:image:width" content="1024">
    <meta property="og:image:height" content="1024">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Strong Cribbage">
    <meta name="twitter:description" content="A sharper cribbage training engine is coming soon.">
    <meta name="twitter:image" content="https://strongcribbage.com/social-preview.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <style>
      :root {
        color-scheme: light dark;
        --bg: #101513;
        --surface: #19201d;
        --line: #34423b;
        --ink: #edf4ef;
        --muted: #a5b6ad;
        --gold: #f2c24f;
        --felt: #17654b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 35% 20%, rgba(23, 101, 75, 0.5), transparent 36%), var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 720px);
        display: grid;
        justify-items: center;
        gap: 22px;
        text-align: center;
      }

      img {
        width: min(48vw, 210px);
        height: auto;
        padding: 10px;
        border: 1px solid rgba(248, 223, 138, 0.44);
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 22px 42px rgba(0, 0, 0, 0.34);
      }

      .eyebrow {
        margin: 0;
        color: var(--gold);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(44px, 10vw, 82px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        max-width: 560px;
        margin: 0;
        color: var(--muted);
        font-size: clamp(18px, 4vw, 24px);
        line-height: 1.35;
      }

      a {
        min-height: 52px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border-radius: 8px;
        background: var(--felt);
        color: #ffffff;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-512.png" alt="Strong Cribbage">
      <p class="eyebrow">Coming soon</p>
      <h1>Strong Cribbage</h1>
      <p>Strong cribbage is going to be the strongest cribbage playing app in the App Store. Version 13.0 is already very good. It’s going to get better. Soon we’ll add training and teaching features. For now you can play the preview.</p>
      <a href="https://cribbage.strongcribbage.com/?splash=1">Play the preview</a>
    </main>
  </body>
</html>
