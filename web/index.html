<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Strong Cribbage</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="topbar">
        <div>
          <h1>Strong Cribbage</h1>
        </div>
        <button id="menu-toggle" class="icon-button" type="button" aria-expanded="false" aria-controls="settings-panel" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div id="settings-panel" class="settings-panel" hidden>
          <label>
            Engine
            <select id="opponent">
              <option value="expert-2.0-ras-tables">Expert 2.0 Ras Tables</option>
              <option value="expert-1.1">Expert 1.1</option>
              <option value="ras-table-1.0">Ras Table 1.0</option>
              <option value="schell-table-1.0">Schell Table 1.0</option>
            </select>
          </label>
          <button id="analytics-open" type="button">Analytics</button>
          <button id="new-game" type="button">New game</button>
        </div>
      </section>

      <section class="scoreboard">
        <div class="score">
          <span class="score-label">User <span id="human-dealer" class="dealer-button" hidden>Dealer</span></span>
          <strong id="human-score">0</strong>
        </div>
        <div id="score-cut" class="score-cut">
          <span>Cut</span>
          <span id="turn-card" class="cut-card"></span>
        </div>
        <div class="score ai">
          <span class="score-label">AI <span id="ai-dealer" class="dealer-button" hidden>Dealer</span></span>
          <strong id="ai-score">0</strong>
        </div>
        <div class="board" id="board" aria-label="Cribbage board"></div>
      </section>

      <section class="table">
        <div class="ai-strip">
          <h2>AI hand</h2>
          <div id="ai-hand" class="cards small"></div>
        </div>
        <div class="status">
          <span>Dealer: <strong id="dealer">-</strong></span>
          <span>Turn: <strong id="turn">-</strong></span>
          <span>Count: <strong id="count">0</strong></span>
        </div>
        <div class="played">
          <h2 id="play-area-title">Current count</h2>
          <div id="plays" class="cards"></div>
          <div id="result" class="result" aria-live="polite"></div>
          <button id="continue-pegging" class="inline-continue" type="button" hidden>Count hands</button>
        </div>
        <div id="scoring-review" class="scoring-review" hidden>
          <h2 id="scoring-title">Hand score</h2>
          <div id="scoring-cards" class="cards"></div>
          <div class="scoring-summary">
            <strong id="scoring-points">0</strong>
            <button id="continue-scoring" type="button">Continue</button>
          </div>
          <div id="scoring-result" class="result scoring-result" aria-live="polite"></div>
        </div>
        <div class="user-panel">
          <h2 id="user-hand-title">User hand</h2>
          <div id="human-hand" class="cards"></div>
          <div class="actions">
            <button id="discard" type="button" disabled>Discard selected</button>
            <button id="play" type="button" disabled>Play selected</button>
            <button id="go" type="button" disabled>Go</button>
          </div>
        </div>
      </section>

      <section id="analytics-page" class="analytics-page" aria-label="Analytics" hidden>
        <div class="analytics-header">
          <div>
            <h2>Analytics</h2>
            <p id="analytics-summary">No gameplay recorded yet.</p>
          </div>
          <button id="analytics-close" type="button">Done</button>
        </div>
        <div id="analytics-totals" class="analytics-totals"></div>
        <div class="analytics-section">
          <h3>Games</h3>
          <div id="analytics-games" class="analytics-list"></div>
        </div>
        <div class="analytics-section">
          <h3>Hands</h3>
          <div id="analytics-hands" class="analytics-list"></div>
        </div>
        <div class="analytics-section">
          <h3>Scoring</h3>
          <div id="analytics-scores" class="analytics-list"></div>
        </div>
        <div class="analytics-section">
          <h3>Pegging</h3>
          <div id="analytics-pegging" class="analytics-list"></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
