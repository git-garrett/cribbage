<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cribbage</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="topbar">
        <div>
          <h1>Cribbage</h1>
          <p id="message">Loading...</p>
        </div>
        <div class="controls">
          <select id="opponent">
            <option value="expert">Expert</option>
            <option value="random">Random</option>
          </select>
          <button id="new-game" type="button">New game</button>
        </div>
      </section>

      <section class="scoreboard">
        <div class="score">
          <span>You</span>
          <strong id="human-score">0</strong>
        </div>
        <div class="board" id="board" aria-label="Cribbage board"></div>
        <div class="score ai">
          <span>DCarlin</span>
          <strong id="ai-score">0</strong>
        </div>
      </section>

      <section class="table">
        <div class="status">
          <span>Dealer: <strong id="dealer">-</strong></span>
          <span>Turn: <strong id="turn">-</strong></span>
          <span>Count: <strong id="count">0</strong></span>
          <span>Cut: <span id="turn-card" class="cut-card"></span></span>
        </div>
        <div class="played">
          <h2>Current count</h2>
          <div id="plays" class="cards"></div>
        </div>
        <div id="scoring-review" class="scoring-review" hidden>
          <h2 id="scoring-title">Hand score</h2>
          <div id="scoring-cards" class="cards"></div>
          <div class="scoring-summary">
            <strong id="scoring-points">0</strong>
            <button id="continue-scoring" type="button">Continue</button>
          </div>
        </div>
      </section>

      <section class="hands">
        <div>
          <h2>DCarlin hand</h2>
          <div id="ai-hand" class="cards small"></div>
        </div>
        <div>
          <h2>Your hand</h2>
          <div id="human-hand" class="cards"></div>
          <div class="actions">
            <button id="discard" type="button" disabled>Discard selected</button>
            <button id="play" type="button" disabled>Play selected</button>
            <button id="go" type="button" disabled>Go</button>
          </div>
        </div>
      </section>

      <aside class="log">
        <h2>Log</h2>
        <ol id="log"></ol>
      </aside>
    </main>
    <script src="app.js"></script>
  </body>
</html>
